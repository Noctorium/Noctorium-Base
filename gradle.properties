kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true


# AndroidX, which every dependency in the android module is built against. Without this AGP refuses the
# build outright rather than warning, since the old support library it would otherwise assume is gone.
android.useAndroidX=true
# Each Gradle module gets its own R class instead of one shared with its dependencies. The default since
# AGP 8, stated so it is not inherited silently.
android.nonTransitiveRClass=true
