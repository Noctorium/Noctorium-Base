name: CI

# Every push and every pull request. This repository is the shared core, so what is checked here is that
# it compiles and that its tests pass; the two applications that consume it check themselves in their own
# repositories, and the release pipeline in Noctorium-Installer builds all of it together.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes the running check pointless, so it is cancelled rather than queued behind it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test the core
        run: ./gradlew :core:test --stacktrace
