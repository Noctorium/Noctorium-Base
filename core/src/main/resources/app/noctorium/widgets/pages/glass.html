<!doctype html>
<!--
  Glass: a frosted dark card with the cover, the title and the artist, the service's logo and a thin progress bar.

  The frost is the cover itself, enlarged and blurred inside the card, under a dark tint. A streaming program draws
  the page on its own and lays it over the stream afterwards, so a backdrop-filter would have nothing behind it to
  blur: the card brings its own.
-->
<html lang="en" data-width="640" data-height="168" data-accent="#b47cff">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noctorium stream widget: Glass</title>
<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    * { box-sizing: border-box; }

    .widget {
        position: absolute; inset: 10px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        color: #fff;
        transition: opacity .6s ease, transform .6s cubic-bezier(.2, .8, .2, 1);
    }
    .is-hidden .widget { opacity: 0; transform: translateY(10px) scale(.98); }

    .card {
        position: absolute; inset: 0; border-radius: 22px; overflow: hidden;
        background: rgb(16, 13, 22);
        box-shadow: 0 10px 28px rgba(0, 0, 0, .42), 0 2px 6px rgba(0, 0, 0, .3);
    }
    .wash { position: absolute; inset: -40% -12%; transition: opacity .5s ease; }
    .wash img { width: 100%; height: 100%; object-fit: cover; filter: blur(30px) saturate(1.7); opacity: .78; }
    .no-art .wash img, .no-cover .wash img { display: none; }
    .wash::after {
        content: ""; position: absolute; inset: 0;
        background: radial-gradient(120% 140% at 0% 0%, rgba(var(--accent-rgb), .30), transparent 60%);
    }
    .tint {
        position: absolute; inset: 0;
        background: linear-gradient(100deg, rgba(12, 10, 18, .42) 0%, rgba(12, 10, 18, .66) 45%, rgba(12, 10, 18, .78) 100%);
    }
    .edge {
        position: absolute; inset: 0; border-radius: 22px; pointer-events: none;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .13), inset 0 1px 0 rgba(255, 255, 255, .16);
        background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, 0) 38%);
    }

    .content { position: absolute; inset: 0; display: flex; align-items: center; gap: 20px; padding: 16px 24px 16px 16px; }
    .no-cover .content { padding-left: 26px; }

    .cover {
        position: relative; flex: none; width: 116px; height: 116px; border-radius: 14px; overflow: hidden;
        background: linear-gradient(135deg, rgba(var(--accent-rgb), .9), rgba(var(--accent-rgb), .35));
        box-shadow: 0 6px 18px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .08);
        transition: opacity .3s ease, transform .3s ease;
    }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cover .note { position: absolute; inset: 0; display: none; place-items: center; font-size: 46px; color: rgba(255, 255, 255, .9); }
    .no-art .cover img { display: none; }
    .no-art .cover .note { display: grid; }
    .no-cover .cover { display: none; }

    .text { position: relative; flex: 1; min-width: 0; transition: opacity .3s ease, transform .3s ease; }
    .is-leaving .text { opacity: 0; transform: translateX(-8px); }
    .is-leaving .cover { opacity: 0; transform: scale(.94); }
    .is-arriving .text { animation: arrive .65s cubic-bezier(.2, .8, .2, 1); }
    .is-arriving .cover { animation: pop .65s cubic-bezier(.2, .8, .2, 1); }
    @keyframes arrive { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
    @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }

    .meta { display: flex; align-items: center; gap: 8px; height: 20px; font-size: 12px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: rgba(255, 255, 255, .74); }
    .chip { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--service); }
    .service-dark .chip { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
    .chip svg { width: 13px; height: 13px; fill: #fff; }
    .no-logo .chip, .no-logo .service { display: none; }
    .service { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .paused { display: none; margin-left: auto; padding: 2px 8px; border-radius: 99px; background: rgba(255, 255, 255, .14); color: rgba(255, 255, 255, .86); letter-spacing: .08em; }
    .is-paused .paused { display: block; }
    /* Without the logo, the row says what the widget is doing instead, so it is not left empty. */
    .status { display: none; }
    .no-logo .status { display: block; }
    .no-logo .paused { display: none; }

    .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title { margin-top: 7px; font-size: 27px; line-height: 1.2; font-weight: 750; letter-spacing: -.01em; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
    .artist { margin-top: 1px; font-size: 18px; line-height: 1.3; font-weight: 500; color: rgba(255, 255, 255, .76); }

    .progress { display: flex; align-items: center; gap: 12px; margin-top: 13px; }
    .bar { position: relative; flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .17); overflow: hidden; }
    .bar i { position: absolute; inset: 0; border-radius: 2px; transform-origin: 0 50%; transform: scaleX(0); background: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb), .9); }
    .is-paused .bar i { background: rgba(255, 255, 255, .62); box-shadow: none; }
    .time { flex: none; font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, .62); font-variant-numeric: tabular-nums; }
    .no-progress .progress { display: none; }
</style>
</head>
<body>
<div id="stage">
    <div class="widget">
        <div class="card">
            <div class="wash"><img data-cover alt=""></div>
            <div class="tint"></div>
            <div class="edge"></div>
        </div>
        <div class="content">
            <div class="cover"><img data-cover alt=""><div class="note">&#9834;</div></div>
            <div class="text">
                <div class="meta">
                    <span class="chip"><svg data-mark viewBox="0 0 24 24"><path d=""/></svg></span>
                    <span class="service" data-text="service"></span>
                    <span class="status" data-text="status">Now playing</span>
                    <span class="paused">Paused</span>
                </div>
                <div class="line title" data-text="title"></div>
                <div class="line artist" data-text="artist"></div>
                <div class="progress">
                    <div class="bar"><i data-progress></i></div>
                    <span class="time"><span data-text="elapsed">0:00</span> / <span data-text="duration">0:00</span></span>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- noctorium:widget-script -->
</body>
</html>
