<!doctype html>
<!--
  Neon: a dark see-through strip with a glowing outline, and the song written in light, in the accent colour -- the
  listener's own in Noctorium unless the address gives another (?accent=ff3366). A new song flickers on as a sign
  does; a pause turns the sign down rather than off.
-->
<html lang="en" data-width="680" data-height="128" data-accent="#b47cff" data-leave="260" data-arrive="900">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noctorium stream widget: Neon</title>
<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    * { box-sizing: border-box; }

    .widget {
        position: absolute; inset: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        color: #fff;
        transition: opacity .6s ease;
    }
    .is-hidden .widget { opacity: 0; }

    .strip {
        position: absolute; inset: 14px; border-radius: 18px;
        background: linear-gradient(180deg, rgba(10, 6, 18, .92), rgba(6, 4, 12, .94));
        border: 2px solid var(--accent);
        box-shadow:
            0 0 4px rgba(var(--accent-rgb), .95), 0 0 14px rgba(var(--accent-rgb), .65), 0 0 30px rgba(var(--accent-rgb), .35),
            inset 0 0 8px rgba(var(--accent-rgb), .45), inset 0 0 24px rgba(var(--accent-rgb), .16);
        transition: box-shadow .8s ease, border-color .8s ease;
    }
    .is-paused .strip {
        border-color: rgba(var(--accent-rgb), .55);
        box-shadow: 0 0 6px rgba(var(--accent-rgb), .35), inset 0 0 10px rgba(var(--accent-rgb), .12);
    }

    .content { position: absolute; inset: 14px; display: flex; align-items: center; gap: 18px; padding: 0 24px 4px 16px; }
    .no-cover .content { padding-left: 26px; }

    .cover {
        position: relative; flex: none; width: 70px; height: 70px; border-radius: 12px; overflow: hidden;
        border: 2px solid var(--accent);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), .7), inset 0 0 8px rgba(var(--accent-rgb), .5);
        background: rgba(var(--accent-rgb), .18);
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover .note { position: absolute; inset: 0; display: none; place-items: center; font-size: 34px; color: var(--accent); text-shadow: 0 0 8px var(--accent); }
    .no-art .cover img { display: none; }
    .no-art .cover .note { display: grid; }
    .no-cover .cover { display: none; }

    .text { flex: 1; min-width: 0; }
    .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Room inside each line for the glow, which would otherwise be cut off at the line's edge. */
    .title {
        padding: 2px 4px; margin: 0 -4px;
        font-size: 27px; line-height: 1.2; font-weight: 750; letter-spacing: .01em;
        color: #fff;
        text-shadow: 0 0 2px rgba(255, 255, 255, .9), 0 0 8px var(--accent), 0 0 18px var(--accent), 0 0 34px rgba(var(--accent-rgb), .7);
    }
    .artist {
        padding: 1px 4px; margin: 0 -4px;
        font-size: 17px; line-height: 1.3; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
        color: var(--accent);
        text-shadow: 0 0 6px rgba(var(--accent-rgb), .9), 0 0 14px rgba(var(--accent-rgb), .5);
    }
    .is-paused .title { text-shadow: 0 0 6px rgba(var(--accent-rgb), .55); color: rgba(255, 255, 255, .8); }
    .is-paused .artist { text-shadow: none; opacity: .75; }

    .mark { flex: none; width: 30px; height: 30px; fill: var(--accent); filter: drop-shadow(0 0 4px var(--accent)) drop-shadow(0 0 10px rgba(var(--accent-rgb), .6)); }
    .no-logo .mark { display: none; }

    .rail { position: absolute; left: 34px; right: 34px; bottom: 22px; height: 2px; border-radius: 1px; background: rgba(var(--accent-rgb), .22); }
    .rail i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: var(--accent); box-shadow: 0 0 6px var(--accent), 0 0 12px rgba(var(--accent-rgb), .7); }
    .rail b { position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; left: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 6px #fff, 0 0 12px var(--accent), 0 0 20px var(--accent); }
    .is-paused .rail b { box-shadow: 0 0 4px var(--accent); }
    .no-progress .rail { display: none; }

    .swap { transition: opacity .25s ease; }
    .is-leaving .swap { opacity: 0; }
    .is-arriving .swap { animation: flicker .9s linear; }
    @keyframes flicker {
        0% { opacity: 0; } 8% { opacity: .85; } 12% { opacity: .1; } 20% { opacity: .9; } 24% { opacity: .3; }
        32% { opacity: 1; } 60% { opacity: .85; } 64% { opacity: 1; } 100% { opacity: 1; }
    }
</style>
</head>
<body>
<div id="stage">
    <div class="widget">
        <div class="strip"></div>
        <div class="content">
            <div class="cover swap"><img data-cover alt=""><div class="note">&#9834;</div></div>
            <div class="text swap">
                <div class="line title" data-text="title"></div>
                <div class="line artist" data-text="artist"></div>
            </div>
            <svg class="mark swap" data-mark viewBox="0 0 24 24"><path d=""/></svg>
        </div>
        <div class="rail"><i data-progress></i><b></b></div>
    </div>
</div>
<script>
    // The spark rides at the head of the line.
    window.widget = {
        progress: function (fraction) {
            var spark = document.querySelector('.rail b');
            if (spark) spark.style.left = (fraction * 100).toFixed(3) + '%';
        }
    };
</script>
<!-- noctorium:widget-script -->
</body>
</html>
